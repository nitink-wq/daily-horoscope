<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Horoscope — AstroLokal</title>
<style>
  /* Self-hosted fonts — no third-party request on a slow connection.
     Lora for headings, Figtree for everything else. */
  @font-face { font-family: Lora; src: url(fonts/lora-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: Lora; src: url(fonts/lora-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: Figtree; src: url(fonts/figtree-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: Figtree; src: url(fonts/figtree-500.woff2) format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: Figtree; src: url(fonts/figtree-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: Figtree; src: url(fonts/figtree-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }

  /* E1 design tokens:
     CTA #F45722 · interactive #FA9C70 · peach (small accents only) #FDD9CE/#FEEEE9
     The page itself leans on the secondary creams: #FFF9F1 / #FFEBD2 / #FFBF6E —
     yellowish cream orange, never pink or red. */
  :root {
    --cta: #F45722;
    --cta-soft: #FA9C70;
    --panel: #FEEEE9;
    --panel-deep: #FDD9CE;
    --cream: #FFF9F1;
    --sand: #FFEBD2;
    --gold: #FFBF6E;
    --rust: #F45722; /* accents stay on the brand CTA orange, never redder */
    --ink: #35200F;
    --ink-soft: #8A6553;
    --ink-faint: #B49484;
    --surface: #FFFFFF;
    --serif: Lora, Georgia, 'Times New Roman', serif;
    --sans: Figtree, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --shadow: 0 10px 26px -12px rgba(122, 62, 30, .22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  i { font-style: normal; }
  html { -webkit-text-size-adjust: 100%; }
  /* Matches the E4 Fortune Card surface: a soft cream-to-peach wash with a
     faint dot grid, flat and calm — the white cards carry the page. */
  body {
    font-family: var(--sans); color: var(--ink); min-height: 100vh;
    background-image:
      radial-gradient(rgba(203, 122, 74, .09) 1px, transparent 1.4px),
      linear-gradient(180deg, #FFF6EC 0%, #FDEBDD 55%, #FBE3D3 100%);
    background-size: 22px 22px, 100% 100%;
    background-attachment: fixed;
    display: flex; justify-content: center;
  }
  .wrap {
    position: relative; z-index: 1; width: 100%; max-width: 430px;
    padding: 0 16px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  h1, h2, h3, .serif { font-family: var(--serif); }
  .hidden { display: none !important; }

  /* ---- nav: back button left, the brand centred --------------------------- */
  .nav {
    display: grid; grid-template-columns: 38px 1fr 38px; align-items: center;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: 10px;
  }
  .nav .back {
    width: 38px; height: 38px; border: 0; cursor: pointer; border-radius: 50%;
    background: rgba(255, 255, 255, .8); box-shadow: 0 1px 4px rgba(122, 62, 30, .12);
    display: flex; align-items: center; justify-content: center;
  }
  .nav .back:active { background: var(--sand); }
  .nav .back svg { width: 19px; height: 19px; }
  /* The brand badge: logo + wordmark in a white pill, like the other
     AstroLokal surfaces. The pill centres in the nav grid. */
  .nav .brand { justify-self: center; display: flex; align-items: center; gap: 7px;
    background: var(--surface); border-radius: 999px; padding: 6px 15px 6px 9px;
    box-shadow: 0 2px 8px rgba(122, 62, 30, .1);
  }
  .nav .brand img { width: 27px; height: 27px; display: block; }
  .nav .word { font-family: var(--sans); font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: #ED8433; }

  /* ---- page title ----------------------------------------------------------
     A small quiet caption tucked under the badge — present, not loud. */
  .pageTitle {
    text-align: center; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--ink-faint); letter-spacing: .04em; padding: 5px 0 12px;
  }

  /* ---- rashi hero card ----------------------------------------------------
     A clean white card, like the E4 streak card: medallion + identity on top,
     one hairline divider, then the three lucky facts as columns — no inner
     boxes, no ornament. */
  .hero {
    position: relative; border-radius: 20px; padding: 15px 14px 13px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .heroTop { display: flex; align-items: center; gap: 12px; padding: 1px 2px 0; }
  /* the rashi artwork — the shared illustrated medallions, shown as a crest */
  .medal {
    width: 66px; height: 66px; border-radius: 50%; overflow: hidden; flex: none;
    box-shadow: 0 3px 10px rgba(122, 62, 30, .22), 0 0 0 2.5px #fff, 0 0 0 4px rgba(244, 87, 34, .35);
    background: #fff;
  }
  .medal img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who { flex: 1; min-width: 0; }
  .who h1 { font-size: 25px; font-weight: 700; color: var(--rust); letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
  .who .elem { font-size: 12.5px; font-weight: 600; color: var(--cta-soft); margin-top: 2px; }
  .who .dob { font-size: 11.5px; font-weight: 500; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
  /* the rashi dropdown, right in the hero: a white pill with an orange
     chevron — the one obvious way to change rashi */
  .chgBtn {
    flex: none; display: flex; align-items: center; gap: 5px; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--cta);
    background: var(--surface); border-radius: 999px; padding: 10px 12px;
    box-shadow: 0 0 0 1.5px rgba(244, 87, 34, .25), 0 2px 8px rgba(122, 62, 30, .12);
    white-space: nowrap;
  }
  .chgBtn:active { background: var(--cream); }
  .chgBtn svg { width: 15px; height: 15px; }

  /* thin divider with three centred dots — decorative only */
  .heroDiv { display: flex; align-items: center; gap: 7px; margin: 12px 4px 11px; }
  .heroDiv .line { flex: 1; height: 1px; background: rgba(244, 87, 34, .22); }
  .heroDiv i { width: 4px; height: 4px; border-radius: 50%; background: var(--cta-soft); }
  .heroDiv i:nth-child(3) { width: 5px; height: 5px; background: var(--cta); }

  /* three columns inside the same white card, separated by hairlines */
  .luckyRow { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .lucky { padding: 2px 4px 0; text-align: center; }
  .lucky + .lucky { border-left: 1px solid #F6E7D8; }
  .lucky .big { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--cta); line-height: 1.15; }
  .lucky .big.time { font-size: 14.5px; padding-top: 4px; }
  .lucky .swatches { display: flex; justify-content: center; gap: 4px; padding: 5px 0 4px; }
  .lucky .swatches i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(53, 32, 15, .14); }
  .lucky .lbl { font-size: 10px; font-weight: 600; color: var(--ink-soft); margin-top: 3px; line-height: 1.25; }

  /* ---- today's reading ---------------------------------------------------- */
  .reading {
    background: var(--surface); border-radius: 18px; padding: 15px 14px; margin-top: 12px;
    box-shadow: var(--shadow);
  }
  .rHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rHead img { width: 22px; height: 22px; flex: none; object-fit: contain; }
  .rHead h2 {
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, #F45722 0%, #B0489B 90%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #F45722;
  }
  .reading p { font-size: 14.5px; line-height: 1.65; color: #4A382B; }

  /* ---- detailed insights (expand) ----------------------------------------- */
  .insToggle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 0; cursor: pointer; margin-top: 10px; padding: 12px;
    font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--rust);
    background: rgba(255, 255, 255, .7); border-radius: 16px;
    box-shadow: inset 0 0 0 1px rgba(244, 87, 34, .18);
  }
  .insToggle:active { background: var(--sand); }
  .insToggle svg { width: 14px; height: 14px; transition: transform .25s ease; }
  .insToggle.open svg { transform: rotate(180deg); }

  /* Collapsed = a sneak peek: the top of the domain cards shows through a
     fade, the toggle sits below. Expanding animates max-height to the grid's
     real height (set from JS). */
  .insWrap { position: relative; max-height: 96px; overflow: hidden; margin-top: 12px; transition: max-height .45s ease; }
  .insFade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68px; pointer-events: none;
    background: linear-gradient(180deg, rgba(253, 235, 221, 0) 0%, #FDEBDD 84%);
    opacity: 1; transition: opacity .3s ease;
  }
  .insWrap.open .insFade { opacity: 0; }
  .insGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .insGrid .dcard {
    background: var(--surface); border-radius: 15px; padding: 12px 11px;
    box-shadow: 0 3px 10px rgba(122, 62, 30, .1);
  }
  .insGrid .dcard:last-child { grid-column: 1 / -1; }
  .dcard .dHead { display: flex; align-items: center; gap: 7px; }
  .dcard .dHead img { width: 22px; height: 22px; flex: none; object-fit: contain; animation: iconPulse 2.4s ease-in-out infinite; }
  .insGrid .dcard:nth-child(2) .dHead img { animation-delay: .3s; }
  .insGrid .dcard:nth-child(3) .dHead img { animation-delay: .6s; }
  .insGrid .dcard:nth-child(4) .dHead img { animation-delay: .9s; }
  .insGrid .dcard:nth-child(5) .dHead img { animation-delay: 1.2s; }
  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dcard .dHead img, .astro .typing i { animation: none !important; }
  }
  .dcard .dHead .name { font-size: 13.5px; font-weight: 700; flex: 1; }
  .dcard .status {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; border-radius: 999px; padding: 3px 9px; margin-top: 8px;
  }
  /* Weak is a muted warm tone, never red — a weak day reads low-key, not alarming */
  .status.strong  { color: #21714A; background: #E1F2E8; }
  .status.neutral { color: #A16414; background: var(--sand); }
  .status.weak    { color: #77604F; background: #F1E7DF; }
  .dcard .line { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin-top: 7px; }

  /* ---- astrologer nudge (chat bubble) + the one CTA ------------------------
     Avatar with a live dot, a speech bubble with typing dots — reads as a
     conversation already waiting, not a banner. */
  .consult { margin-top: 16px; }
  .astro { display: flex; align-items: flex-start; gap: 11px; }
  .astro .avatar { position: relative; width: 46px; height: 46px; flex: none; }
  .astro .avatar svg, .astro .avatar img { width: 46px; height: 46px; border-radius: 50%; display: block; object-fit: cover; }
  .astro .avatar .live {
    position: absolute; right: 1px; bottom: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: #2FBF57; box-shadow: 0 0 0 2.5px #FFF7F0;
  }
  .astro .bubble {
    background: var(--sand); border-radius: 16px 16px 16px 6px; padding: 12px 14px;
    font-size: 14px; font-weight: 500; line-height: 1.55; color: var(--ink);
  }
  .astro .typing { display: flex; gap: 4px; margin-top: 8px; }
  .astro .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: blink 1.3s infinite; }
  .astro .typing i:nth-child(2) { animation-delay: .2s; }
  .astro .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .cta {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px;
    border: 0; cursor: pointer; background: var(--cta); color: #fff; border-radius: 16px; padding: 15px;
    font-family: var(--sans); font-size: 15.5px; font-weight: 700;
    box-shadow: 0 10px 22px -8px rgba(244, 87, 34, .55);
  }
  .cta:active { background: var(--cta-soft); }
  .cta svg { width: 19px; height: 19px; }

  /* the same CTA, re-offered as a sticky bar once the inline one scrolls away */
  .ctaBar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(251, 227, 211, 0) 0%, #FBE3D3 46%);
    transform: translateY(110%); transition: transform .25s ease; pointer-events: none;
  }
  .ctaBar.show { transform: none; pointer-events: auto; }
  .ctaBar .cta { max-width: 398px; margin-top: 0; }

  /* ---- rashi bottom sheet -------------------------------------------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 30; background: rgba(53, 32, 15, .45);
    opacity: 0; transition: opacity .22s ease; pointer-events: none;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    max-width: 430px; margin: 0 auto; max-height: 72vh; overflow-y: auto;
    background: var(--cream); border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .3, 1);
  }
  .sheetOpen .overlay { opacity: 1; pointer-events: auto; }
  .sheetOpen .sheet { transform: none; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(138, 101, 83, .3); margin: 4px auto 12px; }
  .sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; padding: 0 4px; }
  .sheet .hint { font-size: 12.5px; color: var(--ink-soft); padding: 0 4px; margin-bottom: 10px; }
  .rrow {
    width: 100%; display: flex; align-items: center; gap: 12px; border: 0; cursor: pointer;
    text-align: left; font-family: var(--sans); background: transparent;
    padding: 9px 8px; border-radius: 14px;
  }
  .rrow:active { background: var(--sand); }
  .rrow.sel { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--cta), 0 2px 8px rgba(122, 62, 30, .1); }
  .rrow img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(122, 62, 30, .18); }
  .rrow .rr { flex: 1; min-width: 0; }
  .rrow .nm { display: block; font-size: 15px; font-weight: 700; }
  .rrow .nm small { font-weight: 600; color: var(--ink-faint); font-size: 12px; margin-left: 3px; }
  .rrow .dr { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .rrow .chk { width: 20px; height: 20px; flex: none; color: var(--cta); }

  /* ---- error card ---------------------------------------------------------- */
  .errCard {
    background: var(--surface); border-radius: 20px; padding: 26px 20px; margin-top: 30px;
    text-align: center; box-shadow: var(--shadow);
  }
  .errCard h3 { font-size: 18px; margin-bottom: 8px; }
  .errCard p { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .errCard button {
    margin-top: 16px; border: 0; cursor: pointer; background: var(--cta); color: #fff;
    font-family: var(--sans); font-size: 15px; font-weight: 700; border-radius: 12px; padding: 12px 28px;
  }
  .errCard button:active { background: var(--cta-soft); }

  /* first-load skeleton, so a slow connection never shows a blank page */
  .skel { border-radius: 24px; margin-top: 14px; background: linear-gradient(100deg, #FBEBD3 40%, #FFF6E8 50%, #FBEBD3 60%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Rashi swap: the old content dims and a light shimmer sweeps across while
     the new rashi's page is fetched — nothing moves, just a soft "changing"
     cue. The class lives on #main so it survives the innerHTML swap. */
  #main { position: relative; }
  #main.swapping { pointer-events: none; }
  #main.swapping > * { opacity: .55; transition: opacity .2s ease; }
  #main.swapping::after {
    content: ""; position: absolute; inset: 0; z-index: 2; border-radius: 22px;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0) 35%, rgba(255, 255, 255, .8) 50%, rgba(255, 255, 255, 0) 65%);
    background-size: 220% 100%; animation: shimmer 1s linear infinite;
  }

  /* ---- small phones (<= 360px wide) ---------------------------------------
     Everything steps down one more notch so nothing feels cramped. */
  @media (max-width: 360px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    .medal { width: 56px; height: 56px; }
    .who h1 { font-size: 21px; }
    .who .elem { font-size: 11.5px; }
    .chgBtn { padding: 9px 10px; font-size: 12px; }
    .lucky .big { font-size: 18px; }
    .lucky .big.time { font-size: 13.5px; }
    .reading p { font-size: 14px; }
    .cta { font-size: 14.5px; padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <button class="back" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#35200F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="brand"><img src="logo.png" alt=""><span class="word">AstroLokal</span></div>
    <span></span>
  </div>
  <div id="main">
    <div class="skel" style="height:230px"></div>
    <div class="skel" style="height:150px"></div>
  </div>
</div>

<div class="ctaBar" id="ctaBar"></div>

<div id="sheetWrap">
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var USER_ID = params.get('user_id') || '';
  var RASHI = (params.get('rashi') || '').toLowerCase();
  var S = null;           // last /api/horoscope payload
  var rollTimer = null;
  var ctaWatch = null;    // IntersectionObserver driving the sticky CTA bar
  var viewLogged = false; // page_view fires once per open, not per rashi swap
  var swapStart = 0;      // when the rashi-switch shimmer began

  var NET_COPY = { title: 'Connection problem', body: 'Please check your internet and try again.', retry: 'Try Again' };

  // ---- icons ---------------------------------------------------------------
  // Illustrated PNGs (transparent background) generated for this page and
  // shipped in public/icons/. Decorative — empty alt on every one.
  var BOOK_ICON = '<img src="icons/reading.png" alt="">';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHAT_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 01-8 8H7l-4 3v-5.5A8 8 0 1121 12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var AVATAR = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#FFEBD2"/>' +
    '<circle cx="32" cy="25" r="11" fill="#FFF6E8"/>' +
    '<path d="M32 39c12 0 20 8 21 18H11c1-10 9-18 21-18z" fill="#FFF6E8"/>' +
    '<path d="M32 16c5 0 8 3 8 6-3-2-13-2-16 0 0-3 3-6 8-6z" fill="#8A6553" opacity=".55"/></svg>';
  var DOMAIN_ICONS = {
    love: '<img src="icons/love.png" alt="">',
    career: '<img src="icons/career.png" alt="">',
    money: '<img src="icons/money.png" alt="">',
    health: '<img src="icons/health.png" alt="">',
    travel: '<img src="icons/travel.png" alt="">'
  };

  // ---- helpers -------------------------------------------------------------
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function fmt(t, vars) {
    return String(t || '').replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; });
  }
  function api(path, opts) {
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { var e = new Error(body.error || res.status); e.copy = body.copy; throw e; }
        return body;
      });
    });
  }
  function rashiInfo(s, key) {
    for (var i = 0; i < s.rashis.length; i++) if (s.rashis[i].key === key) return s.rashis[i];
    return s.rashis[0];
  }

  // Fire-and-forget engagement event; content_version cuts engagement by copy
  // batch later. sendBeacon survives the page being torn down (CTA/back).
  function logEvent(event) {
    if (!S) return;
    var body = JSON.stringify({
      event: event, rashi: RASHI, user_id: USER_ID || undefined, content_version: S.contentVersion
    });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/event', new Blob([body], { type: 'application/json' }));
    } else {
      fetch('/api/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
    }
  }

  // Back action: return the user where they came from. The closing CTA takes
  // the same action by product decision — the app shell owns astrologer
  // routing; the deeplink is only the fallback when the webview has no
  // history of its own.
  function goBack(fallback) {
    if (history.length > 1) history.back();
    else if (fallback) location.href = fallback;
  }

  // The swap shimmer stays up for at least 600ms so a fast local fetch still
  // reads as "the content changed", then hands back a fully drawn page.
  function endSwap() {
    var m = el('main');
    if (!m.classList.contains('swapping')) return;
    var wait = Math.max(0, 600 - (Date.now() - swapStart));
    setTimeout(function () { m.classList.remove('swapping'); }, wait);
  }

  // ---- render --------------------------------------------------------------
  function renderError(copy) {
    var c = copy || NET_COPY;
    el('main').innerHTML = '<div class="errCard"><h3>' + esc(c.title) + '</h3><p>' + esc(c.body) + '</p>' +
      (c.retry ? '<button id="retryBtn">' + esc(c.retry) + '</button>' : '') + '</div>';
    var btn = el('retryBtn');
    if (btn) btn.onclick = load;
    endSwap();
  }

  function heroHtml(s) {
    var r = rashiInfo(s, s.rashi);
    var h = s.horoscope;
    var swatches = h.luckyColours.map(function (name) {
      return '<i style="background:' + esc(s.colours[name] || '#CCC') + '" title="' + esc(name) + '"></i>';
    }).join('');
    return '<section class="hero">' +
      '<div class="heroTop">' +
        '<div class="medal"><img src="' + esc(r.image) + '" alt="' + esc(r.name) + '"></div>' +
        '<div class="who">' +
          '<h1>' + esc(r.name) + '</h1>' +
          '<div class="elem">' + esc(r.element) + ' Sign</div>' +
          '<div class="dob">' + esc(r.dob) + '</div>' +
        '</div>' +
        // The rashi dropdown lives right here in the hero — one tap opens
        // the picker sheet.
        '<button class="chgBtn" id="pillBtn">' +
          esc((s.copy.selector && s.copy.selector.button) || 'Change Rashi') + CHEV +
        '</button>' +
      '</div>' +
      '<div class="heroDiv"><span class="line"></span><i></i><i></i><i></i><span class="line"></span></div>' +
      '<div class="luckyRow">' +
        '<div class="lucky"><div class="big">' + esc(h.luckyNumber) + '</div><div class="lbl">' + esc(s.copy.lucky.number) + '</div></div>' +
        '<div class="lucky"><div class="big time">' + esc(h.luckyTime) + '</div><div class="lbl">' + esc(s.copy.lucky.time) + '</div></div>' +
        '<div class="lucky"><div class="swatches">' + swatches + '</div><div class="lbl">' + esc(s.copy.lucky.colours) + '</div></div>' +
      '</div>' +
    '</section>';
  }

  function insightsHtml(s) {
    var cards = s.horoscope.domainInsights.map(function (ins) {
      return '<div class="dcard">' +
        '<div class="dHead">' + (DOMAIN_ICONS[ins.domain] || '') +
          '<span class="name">' + esc(s.copy.insights.domains[ins.domain] || ins.domain) + '</span>' +
        '</div>' +
        '<span class="status ' + esc(ins.status) + '">' + esc(s.copy.insights.statuses[ins.status] || ins.status) + '</span>' +
        '<div class="line">' + esc(ins.line) + '</div>' +
      '</div>';
    }).join('');
    // Sneak peek first (the grid clipped behind a fade), the toggle below it.
    return '<div class="insWrap" id="insWrap">' +
        '<div class="insGrid" id="insGrid">' + cards + '</div>' +
        '<div class="insFade"></div>' +
      '</div>' +
      '<button class="insToggle" id="insToggle">' +
        '<span id="insLabel">' + esc(s.copy.insights.show) + '</span>' + CHEV + '</button>';
  }

  function consultHtml(s) {
    var a = s.astrologer || {};
    var avatar = a.avatarUrl ? '<img src="' + esc(a.avatarUrl) + '" alt="">' : AVATAR;
    // The bubble line is generated nightly with the reading; the config line
    // is only the fallback for rows published before that field existed.
    var line = s.horoscope.consultQuestion || fmt(s.copy.consult.line, { name: a.name || '' });
    return '<section class="consult">' +
      '<div class="astro">' +
        '<div class="avatar">' + avatar + '<span class="live"></span></div>' +
        '<div class="bubble">' + esc(line) +
          '<div class="typing"><i></i><i></i><i></i></div></div>' +
      '</div>' +
      '<button class="cta" id="ctaBtn">' + CHAT_ICON + esc(s.copy.consult.cta) + '</button>' +
    '</section>';
  }

  function ctaAction() {
    logEvent('cta_tap');
    goBack(S && S.consultDeeplink);
  }

  // The CTA lives at the end of the story. The sticky bar is the same button
  // re-offered once that one scrolls out of sight — never two at once.
  function watchCta(s) {
    if (ctaWatch) { ctaWatch.disconnect(); ctaWatch = null; }
    el('ctaBar').innerHTML = '<button class="cta" id="barCta">' + CHAT_ICON + esc(s.copy.consult.cta) + '</button>';
    el('barCta').onclick = ctaAction;
    var inline = el('ctaBtn');
    if (!inline || !window.IntersectionObserver) return;
    ctaWatch = new IntersectionObserver(function (entries) {
      el('ctaBar').classList.toggle('show', !entries[0].isIntersecting);
    }, { threshold: 0 });
    ctaWatch.observe(inline);
  }

  function render(s) {
    S = s;
    RASHI = s.rashi;
    document.title = s.copy.header.title + ' — ' + s.copy.header.brand;

    el('main').innerHTML =
      '<h1 class="pageTitle">' + esc(s.copy.header.pageTitle) + '</h1>' +
      heroHtml(s) +
      '<section class="reading">' +
        '<div class="rHead">' + BOOK_ICON + '<h2>' + esc(s.copy.reading.title) + '</h2></div>' +
        '<p>' + esc(s.horoscope.todayReading) + '</p>' +
      '</section>' +
      insightsHtml(s) +
      consultHtml(s);

    fitName();
    el('pillBtn').onclick = openSheet;
    el('insToggle').onclick = toggleInsights;
    el('ctaBtn').onclick = ctaAction;
    watchCta(s);

    if (!viewLogged) { viewLogged = true; logEvent('page_view'); }
    renderSheet(s);
    scheduleRollover(s);
    endSwap();
  }

  // Long rashi names (Sagittarius, Capricorn) must never overflow the hero —
  // step the serif size down until the one-word name fits its column.
  // Starts from the stylesheet size so media queries stay in charge.
  function fitName() {
    var h = el('main').querySelector('.who h1');
    if (!h) return;
    var size = Math.round(parseFloat(getComputedStyle(h).fontSize)) || 25;
    h.style.fontSize = size + 'px';
    while (size > 14 && h.scrollWidth > h.clientWidth) {
      size -= 1;
      h.style.fontSize = size + 'px';
    }
  }

  function toggleInsights() {
    var wrap = el('insWrap');
    var open = !wrap.classList.contains('open');
    wrap.classList.toggle('open', open);
    // Animate to the grid's real height; 96px matches the CSS collapsed peek.
    wrap.style.maxHeight = open ? el('insGrid').scrollHeight + 'px' : '96px';
    el('insToggle').classList.toggle('open', open);
    el('insLabel').textContent = open ? S.copy.insights.hide : S.copy.insights.show;
    if (open) logEvent('insights_expand');
  }

  // ---- rashi bottom sheet: all 12 in DOB order, current highlighted --------
  function renderSheet(s) {
    var rows = s.rashis.map(function (r) {
      var sel = r.key === s.rashi;
      return '<button class="rrow' + (sel ? ' sel' : '') + '" data-rashi="' + esc(r.key) + '">' +
        '<img src="' + esc(r.image) + '" alt="">' +
        '<span class="rr"><span class="nm">' + esc(r.name) + ' <small>' + esc(r.hindi) + '</small></span>' +
        '<span class="dr">' + esc(r.dob) + '</span></span>' +
        (sel ? '<span class="chk">' + CHECK_ICON + '</span>' : '') +
      '</button>';
    }).join('');
    el('sheet').innerHTML = '<div class="grab"></div>' +
      '<h3>' + esc(s.copy.selector.title) + '</h3>' +
      '<div class="hint">' + esc(s.copy.selector.hint) + '</div>' + rows;

    Array.prototype.forEach.call(el('sheet').querySelectorAll('.rrow'), function (node) {
      node.addEventListener('click', function () { pickRashi(node.dataset.rashi); });
    });
  }

  function openSheet() { document.body.classList.add('sheetOpen'); }
  function closeSheet() { document.body.classList.remove('sheetOpen'); }
  el('overlay').addEventListener('click', closeSheet);

  // Swap the whole page to another rashi: re-fetch (date, rashi) from the
  // same endpoint and re-render — no page reload.
  function pickRashi(key) {
    closeSheet();
    if (key === RASHI) return;
    swapStart = Date.now();
    el('main').classList.add('swapping');
    RASHI = key;
    var qs = new URLSearchParams(location.search);
    qs.set('rashi', key);
    history.replaceState(null, '', location.pathname + '?' + qs.toString());
    logEvent('rashi_switch');
    load();
  }

  // Quiet rollover: once the 06:00 IST cutover passes, refetch so a phone
  // left open overnight shows the new day. Server clock, not the device's.
  function scheduleRollover(s) {
    if (rollTimer) clearInterval(rollTimer);
    var skew = Date.parse(s.serverNow) - Date.now();
    var target = Date.parse(s.nextResetAt);
    rollTimer = setInterval(function () {
      if (target - (Date.now() + skew) <= 0) { clearInterval(rollTimer); load(); }
    }, 30000);
  }

  function load() {
    var qs = '?rashi=' + encodeURIComponent(RASHI || '');
    if (USER_ID) qs += '&user_id=' + encodeURIComponent(USER_ID);
    api('/api/horoscope' + qs)
      .then(render)
      .catch(function (err) { renderError(err.copy); });
  }

  el('backBtn').onclick = function () {
    goBack(S && S.nav && S.nav.backDeeplink);
  };

  load();
})();
</script>
</body>
</html>
