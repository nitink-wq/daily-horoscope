# Stateless web tier — safe at any replica count because all content lives in
# Postgres, and the nightly publish is serialized with pg advisory locks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-horoscope
  labels:
    app: daily-horoscope
    role: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: daily-horoscope
      role: web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: daily-horoscope
        role: web
    spec:
      containers:
        - name: web
          image: your-registry/daily-horoscope:latest # set by CI
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: EXPERIMENT_CONFIG_PATH
              value: /etc/daily-horoscope/experiment.config.json
          envFrom:
            - secretRef:
                name: daily-horoscope-secrets
          volumeMounts:
            - name: experiment-config
              mountPath: /etc/daily-horoscope
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: experiment-config
          configMap:
            name: daily-horoscope-config
---
apiVersion: v1
kind: Service
metadata:
  name: daily-horoscope
  labels:
    app: daily-horoscope
spec:
  selector:
    app: daily-horoscope
    role: web
  ports:
    - port: 80
      targetPort: 3000
